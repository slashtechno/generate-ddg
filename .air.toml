root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  args_bin = ["web"]
  # go:embed pulls in assets/html and assets/static at compile time, so
  # template/CSS/JS edits need a rebuild too, not just .go changes.
  include_ext = ["go", "tmpl", "css", "js"]
  exclude_dir = ["tmp", "dist", ".git", ".github", ".vscode"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
